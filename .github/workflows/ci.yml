name: CI

on:
  push:
    branches: [pre, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Install, typecheck, and test
    runs-on: instabox-medium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test
